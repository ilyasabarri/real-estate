<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED599" />
      <stop offset="35%" stop-color="#C59B3F" />
      <stop offset="70%" stop-color="#F2DDAB" />
      <stop offset="100%" stop-color="#9E7624" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#C59B3F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Royal Crown -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- Base band with pearls -->
    <path d="M22 34 Q50 38 78 34 L76 38 Q50 42 24 38 Z" opacity="0.9"/>
    <circle cx="28" cy="36" r="1.5" fill="#FFF8E7"/>
    <circle cx="39" cy="37" r="1.5" fill="#FFF8E7"/>
    <circle cx="50" cy="37.5" r="1.8" fill="#FFF8E7"/>
    <circle cx="61" cy="37" r="1.5" fill="#FFF8E7"/>
    <circle cx="72" cy="36" r="1.5" fill="#FFF8E7"/>

    <!-- Crown Peaks -->
    <path d="M22 34 L18 16 L34 26 L50 10 L66 26 L82 16 L78 34 Q50 40 22 34 Z"/>
    
    <!-- Pearls on peaks -->
    <circle cx="18" cy="15" r="2.5" fill="#FFF8E7"/>
    <circle cx="34" cy="25" r="2" fill="#FFF8E7"/>
    <circle cx="50" cy="9" r="3.2" fill="#FFF8E7"/>
    <circle cx="66" cy="25" r="2" fill="#FFF8E7"/>
    <circle cx="82" cy="15" r="2.5" fill="#FFF8E7"/>
  </g>

  <!-- Intertwined Serif ME Monogram -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- Letter M -->
    <path d="M26 48 H36 L43 76 L50 54 H52 L59 76 L66 48 H74 L62 90 H56 L49 68 L42 90 H36 L26 48 Z" />
    <!-- Architectural Stylized Accentuate Bars -->
    <path d="M30 92 Q50 96 70 92 L69 94 Q50 98 31 94 Z" opacity="0.8"/>
  </g>
</svg>
