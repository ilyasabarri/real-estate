<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" fill="none">
  <defs>
    <linearGradient id="goldFootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DCAB" />
      <stop offset="35%" stop-color="#C59B3F" />
      <stop offset="70%" stop-color="#EED599" />
      <stop offset="100%" stop-color="#9E7624" />
    </linearGradient>
    <filter id="glowF" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C59B3F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Crown Centered -->
  <g filter="url(#glowF)" fill="url(#goldFootGrad)" transform="translate(130, 0)">
    <path d="M22 34 Q50 38 78 34 L76 38 Q50 42 24 38 Z" opacity="0.9"/>
    <circle cx="28" cy="36" r="1.5" fill="#FFF8E7"/>
    <circle cx="39" cy="37" r="1.5" fill="#FFF8E7"/>
    <circle cx="50" cy="37.5" r="1.8" fill="#FFF8E7"/>
    <circle cx="61" cy="37" r="1.5" fill="#FFF8E7"/>
    <circle cx="72" cy="36" r="1.5" fill="#FFF8E7"/>

    <path d="M22 34 L18 16 L34 26 L50 10 L66 26 L82 16 L78 34 Q50 40 22 34 Z"/>
    <circle cx="18" cy="15" r="2.5" fill="#FFF8E7"/>
    <circle cx="34" cy="25" r="2" fill="#FFF8E7"/>
    <circle cx="50" cy="9" r="3.2" fill="#FFF8E7"/>
    <circle cx="66" cy="25" r="2" fill="#FFF8E7"/>
    <circle cx="82" cy="15" r="2.5" fill="#FFF8E7"/>

    <!-- ME Monogram -->
    <path d="M28 46 H38 L44 72 L50 52 H52 L58 72 L64 46 H74 L62 86 H56 L49 66 L42 86 H36 L28 46 Z" />
  </g>

  <!-- Title: MAJESTIC ESTATES -->
  <text 
    x="180" 
    y="130" 
    text-anchor="middle"
    font-family="'Playfair Display', 'Cinzel', Georgia, serif" 
    font-size="26" 
    font-weight="700" 
    letter-spacing="5" 
    fill="url(#goldFootGrad)"
  >
    MAJESTIC ESTATES
  </text>

  <!-- Subtitle with flanking lines -->
  <line x1="40" y1="150" x2="90" y2="150" stroke="url(#goldFootGrad)" stroke-width="1.2" opacity="0.8"/>
  <text 
    x="180" 
    y="154" 
    text-anchor="middle"
    font-family="Inter, sans-serif" 
    font-size="11" 
    font-weight="600" 
    letter-spacing="3.5" 
    fill="#DDC48C"
  >
    REAL ESTATE MAROC
  </text>
  <line x1="270" y1="150" x2="320" y2="150" stroke="url(#goldFootGrad)" stroke-width="1.2" opacity="0.8"/>

  <!-- Motto: L'Excellence dans Chaque Demeure. -->
  <text 
    x="180" 
    y="180" 
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif" 
    font-style="italic"
    font-size="13" 
    fill="#A49C8C"
  >
    L'Excellence dans Chaque Demeure.
  </text>
</svg>
