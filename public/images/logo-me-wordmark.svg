  >
    IMMOBILIER DE PRESTIGE
  </text>

  <!-- Right horizontal accent line -->
  <line x1="228" y1="46" x2="270" y2="46" stroke="url(#goldWordGrad)" stroke-width="1.2" opacity="0.8"/>
