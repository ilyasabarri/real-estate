<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" fill="none">
  <defs>
    <linearGradient id="goldWordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DCAB" />
      <stop offset="40%" stop-color="#C59B3F" />
      <stop offset="75%" stop-color="#EED599" />
      <stop offset="100%" stop-color="#A57D28" />
    </linearGradient>
  </defs>

  <!-- Title: MAJESTIC ESTATES -->
  <text 
    x="0" 
    y="28" 
    font-family="'Playfair Display', 'Cinzel', Georgia, serif" 
    font-size="22" 
    font-weight="700" 
    letter-spacing="4" 
