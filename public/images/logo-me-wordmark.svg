  >
    MAJESTIC ESTATES
  </text>

  <!-- Left horizontal accent line -->
  <line x1="0" y1="46" x2="38" y2="46" stroke="url(#goldWordGrad)" stroke-width="1.2" opacity="0.8"/>

  <!-- Subtitle: IMMOBILIER DE PRESTIGE • MAROC -->
  <text 
    x="46" 
    y="49" 
    font-family="Inter, sans-serif" 
